<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    NoteforJun 앱 아이콘.

    메모지 위에 깃털 하나. 색은 앱에서 그대로 가져온다 — 바탕은 상단바 노랑,
    종이는 본문 아이보리, 깃털은 상단바 글자색이다. 아이콘과 앱을 나란히 놓았을
    때 같은 물건으로 보여야 한다.

    요소를 셋으로 줄인 것은 작업표시줄 크기(16~32px) 때문이다. 그보다 더 넣으면
    작은 크기에서 뭉개져 무엇인지 알 수 없는 얼룩이 된다.
  -->
  <rect width="1024" height="1024" rx="216" fill="#E0B84D"/>

  <!-- 메모지 -->
  <rect x="196" y="146" width="632" height="732" rx="60" fill="#FBF8F2"/>

  <!-- 적어둔 줄. 깃털이 덮지 않는 위쪽에만 둔다. -->
  <g fill="#DED8C9">
    <rect x="280" y="256" width="464" height="32" rx="16"/>
    <rect x="280" y="348" width="372" height="32" rx="16"/>
  </g>

  <!--
    깃털.

    깃을 좁고 길게 뽑고 깃대를 그 위에 올린다. 깃이 넓고 둥글면 나뭇잎이 되고,
    깃대가 깃 아래 깔리면 가운데 선이 보이지 않아 역시 잎이 된다. 깃털로
    읽히게 하는 것은 이 두 가지다 — 가운데를 지나는 선, 그리고 아래로 길게
    빠져나온 맨 깃대.
  -->
  <g transform="translate(528 604) rotate(-38) scale(1.12)">
    <!--
      깃을 통째로 닫힌 도형 하나로 그린다. 좌우를 따로 그리면 테두리가 가운데를
      두 번 지나 깃대와 겹쳐 지저분해진다.

      흰 깃을 아이보리 종이 위에 올리므로 색만으로는 경계가 안 보인다.
      테두리가 그 일을 한다 — 작은 크기에서 형태를 버티게 하는 것도 테두리다.
    -->
    <path d="M0 -236
             C 76 -152, 88 -18, 40 112
             C 24 158, 8 192, 0 208
             C -8 192, -24 158, -40 112
             C -88 -18, -76 -152, 0 -236 Z"
          fill="#FFFFFF" stroke="#3D2F10" stroke-width="21" stroke-linejoin="round"/>

    <!-- 깃가지. 흰 깃 위에 올리므로 진한 색으로 긋는다. -->
    <g stroke="#3D2F10" stroke-linecap="round" fill="none" stroke-width="13">
      <path d="M0 -122 L56 -164"/>
      <path d="M0 -122 L-56 -164"/>
      <path d="M0 -26 L66 -76"/>
      <path d="M0 -26 L-66 -76"/>
      <path d="M0 70 L50 16"/>
      <path d="M0 70 L-50 16"/>
    </g>

    <!-- 깃대. 가운데를 지나 아래로 길게 빠져나와 펜촉이 된다. -->
    <path d="M0 -214 L0 276" stroke="#3D2F10" stroke-width="17" stroke-linecap="round"/>
  </g>
</svg>
