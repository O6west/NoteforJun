<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    NoteforJun 앱 아이콘. 모서리가 접힌 아이보리 종이 위의 깃펜.

    깃털 자체는 처음 정한 모양 그대로다. 바뀐 것은 그 아래 깔린 종이뿐이다 —
    아무 뜻 없는 둥근 사각형에서, 모서리가 접힌 스티커로. 메모 앱이라는 사실이
    아이콘에서 먼저 읽힌다.

    종이를 아예 없애고 깃털만 남기는 안도 만들어 봤지만 되돌렸다. 바탕이 하는
    일은 장식이 아니라 대비를 보장하는 것이다 — 아이콘이 어떤 바탕 위에 놓일지
    우리는 고를 수 없다. 작업표시줄, 바탕화면 사진, 파일 탐색기가 전부 다르고,
    바탕 없는 깃털은 그중 밝은 쪽에서 16px일 때 사라지다시피 했다.
    종이가 그 아래를 덮으면 어디에 놓이든 종이와 깃털의 대비는 그대로 남는다.

    접힌 자리를 오른쪽 "위"에 둔 이유. 스티커는 보통 아래에서 떨어지니 처음엔
    오른쪽 아래에 뒀는데, 깃대가 바로 그쪽으로 쓸려 내려가 둘이 포개졌다.
    깃털은 왼쪽 위(깃 끝)에서 오른쪽 아래(깃대)로 흐르므로, 접힘을 위로 올리면
    동선이 겹치지 않고 깃털을 키울 여유도 생긴다.

    스티커가 판을 꽉 채우는(테두리 여백 8) 이유. 작업표시줄에 놓이면 옆
    아이콘들과 나란히 서게 되는데, 대부분은 그림이 판을 끝까지 채운다.
    혼자 여백을 두면 크기가 같아도 작아 보인다. 여백 96에서 48로, 다시 8로
    두 번 줄였다 — 48도 옆에 두고 보니 여전히 작았다.

    모서리 반지름·접힘 크기·깃털 배율은 종이 폭에 비례해 함께 따라간다
    (폭 × 176/832 식). 여백만 바꿔도 비율은 흐트러지지 않는다.

    종이색은 본문 바탕색(#FBF8F2)을 그대로 쓴다. 앱을 열면 가장 넓게 보이는
    것이 이 색이고, 아이콘이 그 색이면 아이콘과 앱이 같은 물건으로 보인다.

    한때 밝은 노랑(#FBCF3C)으로 가 봤다. 작업표시줄에서 가장 잘 띄는 것은
    그쪽이 맞다. 그래도 종이색으로 돌아온 것은, 띄는 것보다 앱과 같아 보이는
    쪽을 골랐기 때문이다.

    밝은 바탕에서는 종이가 배경에 묻힌다. 그래도 읽히는 것은 검은 깃털이
    덩어리를 만들어 주기 때문이다 — 어두운 작업표시줄과 바탕화면 사진 위에서는
    반대로 종이가 환하게 뜬다.

    깃털의 변형 기준점을 도형의 실제 중심(로컬 31, 76)에 맞춰 두었다. 그래서
    translate(512 512) 한 줄로 스티커 정중앙에 놓인다. 크기를 바꿀 일이 있으면
    scale 값만 건드리면 되고 자리는 그대로다.

    깃털 모양 자체에 대한 기록:
    1. 깃가지는 뾰족한 끝을 향해 눕는다. 깃대와 직각에 가깝게 그으면 빗처럼
       보이고, 눕혀야 깃털로 읽힌다.
    2. 깃대는 깃 안에서 곧고, 깃 아래로 나오면서 가늘고 길게 휜다. 그 휨 하나가
       나뭇잎과 깃펜을 가른다. 곧으면 잎자루, 휘면 손에 쥐는 펜이다.
    3. 깃을 진하게 채우고 깃가지를 바탕색으로 파낸다. 어두운 깃 위에 더 어두운
       선을 올리면 묻혀서, 가운데 선이 없는 잎이 된다.
    4. 좌우 폭을 살짝 다르게 둔다. 완전 대칭은 만들어진 티가 난다.

    이 앱은 창 테두리가 없어 작업표시줄 아이콘이 사용자가 앱을 알아보는
    거의 유일한 표지다. 그래서 16~32px에서 버티는 쪽을 골랐다.
  -->

  <!-- 스티커. 오른쪽 위 모서리가 잘려 나간 자리가 접힌 자국이다. -->
  <path d="M221 8 H728 L1016 296 V803 A213 213 0 0 1 803 1016
           H221 A213 213 0 0 1 8 803 V221 A213 213 0 0 1 221 8 Z" fill="#FBF8F2"/>
  <path d="M728 8 L1016 296 L728 296 Z" fill="#E6DECA"/>

  <g transform="translate(512 512) rotate(-34) scale(1.212) translate(-31 -76)">
    <!-- 깃 -->
    <path d="M0 -252 C 84 -164, 94 -20, 40 110 C 24 158, 8 190, 0 206
             C -8 190, -24 158, -38 110 C -86 -20, -76 -164, 0 -252 Z"
          fill="#2E2E2C" stroke="#2E2E2C" stroke-width="17" stroke-linejoin="round"/>

    <!-- 깃가지. 스티커 색으로 파낸 자국이다. -->
    <g stroke="#FBF8F2" stroke-linecap="round" fill="none" stroke-width="12">
      <path d="M0 -142 Q 36 -178, 52 -206"/><path d="M0 -142 Q -34 -178, -48 -206"/>
      <path d="M0 -56 Q 46 -100, 66 -134"/><path d="M0 -56 Q -42 -100, -60 -134"/>
      <path d="M0 28 Q 44 -14, 62 -46"/><path d="M0 28 Q -40 -14, -56 -46"/>
      <path d="M0 106 Q 32 70, 44 44"/><path d="M0 106 Q -30 70, -42 44"/>
    </g>

    <!-- 깃대. 깃 안에서는 깃에 묻히고, 밖으로 나오면서 드러난다. -->
    <path d="M0 194 C 18 270, 60 340, 148 404" stroke="#2E2E2C" stroke-width="13"
          stroke-linecap="round" fill="none"/>
  </g>
</svg>
