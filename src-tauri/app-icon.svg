<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    NoteforJun 앱 아이콘.

    메모지 위에 깃털 하나. 색은 앱에서 그대로 가져온다 — 바탕은 상단바 노랑,
    종이는 본문 아이보리, 깃털은 상단바 글자색이다. 아이콘과 앱을 나란히 놓았을
    때 같은 물건으로 보여야 한다.

    요소를 셋으로 줄인 것은 작업표시줄 크기(16~32px) 때문이다. 그보다 더 넣으면
    작은 크기에서 뭉개져 무엇인지 알 수 없는 얼룩이 된다.
  -->
  <rect width="1024" height="1024" rx="216" fill="#E0B84D"/>

  <!-- 메모지 -->
  <rect x="196" y="146" width="632" height="732" rx="60" fill="#FBF8F2"/>

  <!-- 적어둔 줄. 깃털이 덮지 않는 위쪽에만 둔다. -->
  <g fill="#DED8C9">
    <rect x="280" y="256" width="464" height="32" rx="16"/>
    <rect x="280" y="348" width="372" height="32" rx="16"/>
  </g>

  <!--
    깃털.

    깃을 좁고 길게 뽑고 깃대를 그 위에 올린다. 깃이 넓고 둥글면 나뭇잎이 되고,
    깃대가 깃 아래 깔리면 가운데 선이 보이지 않아 역시 잎이 된다. 깃털로
    읽히게 하는 것은 이 두 가지다 — 가운데를 지나는 선, 그리고 아래로 길게
    빠져나온 맨 깃대.
  -->
  <g transform="translate(528 604) rotate(-38) scale(1.12)">
    <!-- 오른쪽 깃 -->
    <path d="M0 -236 C 76 -152, 88 -18, 40 112 C 24 158, 8 192, 0 208 Z" fill="#3D2F10"/>
    <!-- 왼쪽 깃. 살짝 밝게 해서 두 갈래로 갈린 것이 보이게 한다. -->
    <path d="M0 -236 C -76 -152, -88 -18, -40 112 C -24 158, -8 192, 0 208 Z" fill="#5C5027"/>

    <!--
      깃가지와 깃대를 종이색으로 판다. 어두운 깃 위에 더 어두운 선을 올리면
      묻혀서 안 보이고, 그러면 가운데 선이 없는 잎이 된다. 파낸 자국이라야
      깃털로 읽힌다.
    -->
    <g stroke="#FBF8F2" stroke-linecap="round" fill="none">
      <path d="M0 -218 L0 198" stroke-width="13"/>
      <g stroke-width="8" opacity="0.9">
        <path d="M0 -122 L58 -166"/>
        <path d="M0 -122 L-58 -166"/>
        <path d="M0 -26 L68 -78"/>
        <path d="M0 -26 L-68 -78"/>
        <path d="M0 70 L52 14"/>
        <path d="M0 70 L-52 14"/>
      </g>
    </g>

    <!-- 맨 깃대. 깃 아래로 길게 빠져나와 펜촉처럼 보이게 한다. -->
    <path d="M0 192 L0 276" stroke="#3D2F10" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
